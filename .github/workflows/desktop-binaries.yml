name: Desktop binaries

# Builds the GameMaker extension's native library for every desktop target from
# sample/extensions/GameAnalyticsExt/DesktopSource, so releases no longer depend
# on someone having a Windows box, a Linux box and a Mac to hand.
#
# Each job produces exactly the file GameAnalyticsExt.yy expects:
#   macos-universal  libGameAnalytics.dylib   (x86_64 + arm64)
#   linux-x64        libGameAnalytics.so
#   windows-x64      GameAnalytics.dll        (64-bit)
#
# 32-bit Windows was dropped: it never built (the DLL's import library
# collided with the C++ SDK's GameAnalytics.lib, LNK1149) and GameMaker's
# Windows target is x64. The extension declares one Windows library, named
# GameAnalytics.dll, and this is it.
#
# Collect them with ./fetch_desktop_binaries.py, or by hand:
#   gh run download <run-id> -n desktop-binaries -D sample/extensions/GameAnalyticsExt
# and commit the three files.

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "override the gameanalytics-sdk-cpp ref (default: dependencies.json)"
        required: false
        default: ""
  pull_request:
    paths:
      - "sample/extensions/GameAnalyticsExt/DesktopSource/**"
      - ".github/workflows/desktop-binaries.yml"
  push:
    branches: [master]
    paths:
      - "sample/extensions/GameAnalyticsExt/DesktopSource/**"
      - ".github/workflows/desktop-binaries.yml"

jobs:
  # The ref lives in dependencies.json so that CI, the local build and
  # ./download_externals.py cannot disagree about which C++ SDK is being built.
  # It is resolved once here rather than in each matrix job, so every
  # library is guaranteed to come from the same source revision.
  dependency:
    name: resolve C++ SDK ref
    runs-on: ubuntu-latest
    outputs:
      sdk_ref: ${{ steps.resolve.outputs.sdk_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned ref
        id: resolve
        shell: bash
        run: |
          OVERRIDE="${{ github.event.inputs.sdk_ref }}"
          if [ -n "$OVERRIDE" ]; then
            REF="$OVERRIDE"
            ORIGIN="workflow_dispatch input"
          else
            # A 'ref' in dependencies.json wins over 'version': the tag
            # v5.4.1 builds the static library without -fPIC and the Linux .so
            # then fails to link, so the pin is currently a commit past it.
            REF=$(python3 -c 'import json; d=json.load(open("dependencies.json")); c=next(x for x in d if x["name"]=="GA-SDK-CPP"); print(c.get("ref") or "v"+c["version"])')
            ORIGIN="dependencies.json"
          fi
          if [ -z "$REF" ]; then
            echo "::error::could not determine a GA-SDK-CPP ref"
            exit 1
          fi
          echo "sdk_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building against gameanalytics-sdk-cpp $REF (from $ORIGIN)"

  build:
    needs: dependency
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            # Pinned like the others, but unlike Linux the pin is not what sets
            # the compatibility floor - CMAKE_OSX_DEPLOYMENT_TARGET does - so
            # when an image retires (macOS 14 did, 2 November 2026) bumping this
            # to the next supported arm64 label is all that is needed.
            os: macos-15
            artifact: libGameAnalytics.dylib
          - name: linux-x64
            # Deliberately not ubuntu-latest: the runner's glibc becomes the
            # minimum glibc of every game shipping this library, so build
            # against the oldest one still supported by Actions.
            os: ubuntu-22.04
            artifact: libGameAnalytics.so
          - name: windows-x64
            os: windows-2022
            cmake_arch: x64
            vcpkg_triplet: x64-windows-static-md
            artifact: GameAnalytics.dll

    steps:
      - name: Check out the GameMaker SDK
        uses: actions/checkout@v4

      - name: Check out the C++ SDK
        uses: actions/checkout@v4
        with:
          repository: GameAnalytics/gameanalytics-sdk-cpp
          ref: ${{ needs.dependency.outputs.sdk_ref }}
          path: sdk-cpp
          submodules: recursive

      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      # The SDK builds against the dynamic CRT, so zlib has to match: the
      # -static-md triplet is a static lib linked against the dynamic runtime,
      # which keeps the extension a single self-contained DLL.
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "zlib:${{ matrix.vcpkg_triplet }}"

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA="-A ${{ matrix.cmake_arch }}"
            EXTRA="$EXTRA -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            EXTRA="$EXTRA -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"
          fi
          cmake -S sample/extensions/GameAnalyticsExt/DesktopSource -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGA_SDK_DIR="$PWD/sdk-cpp" \
            $EXTRA

      - name: Build
        run: cmake --build build --config Release --target GameAnalyticsGM --parallel

      # A library that loads but is missing an entry point fails silently at
      # runtime — GameMaker resolves extension functions lazily — so check the
      # export table here instead of finding out in a game.
      - name: Verify exports (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          LIB="sample/extensions/GameAnalyticsExt/${{ matrix.artifact }}"
          test -f "$LIB" || { echo "::error::$LIB was not produced"; exit 1; }

          if [ "${{ runner.os }}" = "macOS" ]; then
            nm -gU "$LIB" | sed -n 's/.* T _//p' | sort -u > exports.txt
          else
            nm -D --defined-only "$LIB" | sed -n 's/.* T //p' | sort -u > exports.txt
          fi

          missing=""
          while read -r fn; do
            grep -qx "$fn" exports.txt || missing="$missing $fn"
          done < .github/workflows/required-exports.txt

          if [ -n "$missing" ]; then
            echo "::error::missing entry points:$missing"
            exit 1
          fi
          echo "all $(wc -l < .github/workflows/required-exports.txt) required entry points present"

      - name: Verify exports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = "sample/extensions/GameAnalyticsExt/${{ matrix.artifact }}"
          if (-not (Test-Path $lib)) { Write-Output "::error::$lib was not produced"; exit 1 }

          # No nm on the runner; export names appear verbatim in the PE export
          # table, so match them in the raw bytes.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($lib))
          $required = Get-Content .github/workflows/required-exports.txt
          $missing = $required | Where-Object { $text -notmatch "\b$_\b" }

          if ($missing) { Write-Output "::error::missing entry points: $($missing -join ' ')"; exit 1 }
          Write-Output "all $($required.Count) required entry points present"

      - name: Report what was built
        shell: bash
        run: |
          LIB="sample/extensions/GameAnalyticsExt/${{ matrix.artifact }}"
          ls -l "$LIB"
          if [ "${{ runner.os }}" = "macOS" ]; then
            lipo -info "$LIB"
            echo "non-system dependencies (should be none):"
            otool -L "$LIB" | tail -n +2 | grep -v "^\s*/System\|^\s*/usr/lib\|$(basename "$LIB")" || echo "  none"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            echo "shared dependencies:"; ldd "$LIB" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: sample/extensions/GameAnalyticsExt/${{ matrix.artifact }}
          if-no-files-found: error

  collect:
    name: desktop-binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      # One artifact holding all three libraries, laid out so it can be
      # unzipped straight over sample/extensions/GameAnalyticsExt/.
      - name: Flatten
        run: |
          mkdir -p desktop-binaries
          find staging -type f -exec cp {} desktop-binaries/ \;
          ls -l desktop-binaries

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries
          path: desktop-binaries/
          if-no-files-found: error
